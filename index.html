<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ALI HALIM | GIS Specialist</title><style>html,body{margin:0;min-height:100%;background:#041016;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;color:#9cb3bc;font-size:13px;letter-spacing:.08em}.fix-css{display:none}</style></head><body><div id="boot">LOADING GIS PORTFOLIO…</div><script>(async()=>{try{const r=await fetch('legacy.html?rev=layout-fix-01',{cache:'no-store'});const text=await r.text();const doc=new DOMParser().parseFromString(text,'text/html');document.title=doc.title;document.head.innerHTML=doc.head.innerHTML+'<style id="portfolio-fixes">.layoutFrame{width:100%;height:100%;min-height:520px;border:0;display:block;background:#fff}.layout.realestate{grid-column:span 2}.realestateImg{width:100%;height:auto;display:block;object-fit:contain}.deliverableTag{display:inline-flex;margin-top:8px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--gold);font-size:8px;font-weight:900}.deliverablesNote{margin-top:12px;color:var(--muted);font-size:10px}@media(max-width:620px){.layoutFrame{height:460px;min-height:460px}.layout.realestate{grid-column:auto}.realestateImg{width:100%;height:auto}.deliverablesNote{font-size:9px}}</style>';document.body.innerHTML=doc.body.innerHTML;for(const oldScript of doc.scripts){const s=document.createElement('script');s.textContent=oldScript.textContent;document.body.appendChild(s)}
// Preserve the original map sheets exactly: use the original PDF files, not cropped/stretched screenshots.
const pdfs=['Stormwater_Layout_01.pdf','Stormwater_Layout_02.pdf','Stormwater_Layout_03.pdf','Stormwater_Layout_04.pdf','Stormwater_Layout_05.pdf'];
const titles=['Stormwater Layout 01','Stormwater Layout 02','Stormwater Layout 03','Stormwater Layout 04','Stormwater Layout 05'];
const desc=['Detailed stormwater network sheet with surveyed utility features and engineering cartography.','Urban stormwater network sheet showing connected drainage assets and pipe diameters.','Large-area stormwater mapping with network interpretation and spatial reference.','High-detail PRD / stormwater connection sheet with local utility features.','Urban drainage corridor sheet with stormwater infrastructure and cartographic delivery.'];
const box=document.querySelector('#deliverables .layouts');if(box){box.innerHTML='';pdfs.forEach((pdf,i)=>{const el=document.createElement('article');el.className='layout reveal';el.innerHTML='<iframe class="layoutFrame" loading="lazy" src="'+pdf+'#page=1&view=FitH" title="'+titles[i]+'"></iframe><div class="body"><h3>'+titles[i]+'</h3><span>'+desc[i]+'</span><div class="deliverableTag">ORIGINAL PDF · UNALTERED</div><div class="layoutActions"><a class="pdf" href="'+pdf+'" target="_blank">OPEN ORIGINAL PDF ↗</a></div></div>';box.appendChild(el)})}
// Replace the three small project layout thumbnails with exact PDF previews too.
const gal=document.querySelector('#projects .gallery');if(gal){gal.innerHTML='';pdfs.slice(0,3).forEach((pdf,i)=>{const el=document.createElement('div');el.className='tile';el.innerHTML='<iframe class="layoutFrame" style="height:420px" loading="lazy" src="'+pdf+'#page=1&view=FitH" title="'+titles[i]+'"></iframe><div class="body"><h3>'+titles[i]+'</h3><p>'+desc[i]+'</p></div>';gal.appendChild(el)})}
// Add the real-estate layout supplied in the repository.
const deliver=document.querySelector('#deliverables .wrap');if(deliver&&!document.getElementById('realEstateAddon')){const addon=document.createElement('div');addon.id='realEstateAddon';addon.className='layout realestate reveal';addon.style.marginTop='13px';addon.innerHTML='<img class="realestateImg" src="realestate-layout.jpg" alt="Real Estate GIS Layout"><div class="body"><h3>Real Estate GIS Layout</h3><span>Parcel mapping, land-use classification and authority-oriented GIS schema presentation.</span><div class="deliverableTag">REAL ESTATE GIS · CAD → GIS SCHEMA</div></div>';deliver.appendChild(addon)}
// Keep the visual site motion, but never alter the actual map sheets.
const m=document.getElementById('motion');if(m){m.style.pointerEvents='none'}
}catch(e){document.body.innerHTML='<div style="padding:40px;color:#fff;font:16px system-ui">Portfolio loading error.</div>';console.error(e)}})();</script></body></html>
