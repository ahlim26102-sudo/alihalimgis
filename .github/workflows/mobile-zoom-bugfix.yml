name: Fix mobile zoom and interaction stability
on:
  push:
    paths:
      - '.github/workflows/mobile-zoom-bugfix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile zoom stability
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* MOBILE ZOOM STABILITY V1 */'
          css='''\n/* MOBILE ZOOM STABILITY V1 */\nhtml{width:100%;min-width:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}\nbody{width:100%;min-width:0;overscroll-behavior-x:none;-webkit-overflow-scrolling:touch}\nbody,main,section,.wrap,.heroGrid,.visual,.gallery,.layouts,.analyticsGrid,.serviceGrid{max-width:100%;}\n.gisAnnotation{position:absolute!important;top:0;left:0;width:100%;height:100%;min-height:100%;z-index:0!important;contain:paint;transform:translateZ(0);}\n.gisAnnotation svg{pointer-events:none!important;touch-action:none!important;}\nbody>header,body>main,body>footer{position:relative;z-index:2;}\nimg,svg,iframe{max-width:100%;}\na,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}\n@media(max-width:680px){\n  html,body{overflow-x:hidden;}\n  body{touch-action:pan-y pinch-zoom;}\n  .gisAnnotation{opacity:.62!important;}\n  .visual,.media,.tile,.layout,.analyticsCard{contain:layout paint;}\n}\n@media(prefers-reduced-motion:reduce){.gisAnnotation *{animation:none!important;}}\n'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          # Make the mobile chips real links without changing their visual style.
          old="""<span class=\"chip\">100+ CAD → GIS Projects</span><span class=\"chip\">Utility Networks</span><span class=\"chip\">Enterprise Geodatabase</span><span class=\"chip\">QA/QC</span><span class=\"chip\">Python / ArcPy</span>"""
          new="""<a class=\"chip\" href=\"#projects\">100+ CAD → GIS Projects</a><a class=\"chip\" href=\"#projects\">Utility Networks</a><a class=\"chip\" href=\"#about\">Enterprise Geodatabase</a><a class=\"chip\" href=\"#services\">QA/QC</a><a class=\"chip\" href=\"#tool\">Python / ArcPy</a>"""
          s=s.replace(old,new,1)
          # Prevent the old fixed annotation styling from winning over the stability rule.
          s=s.replace('.gisAnnotation{position:fixed;inset:0;z-index:0;', '.gisAnnotation{position:absolute;inset:0;z-index:0;', 1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix mobile zoom and interaction stability' || true
          git rm .github/workflows/mobile-zoom-bugfix.yml || true
          git commit -m 'Remove one-time mobile zoom bugfix workflow' || true
          git push origin HEAD:main
