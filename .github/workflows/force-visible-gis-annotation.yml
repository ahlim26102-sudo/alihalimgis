name: Force visible animated GIS annotation
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace annotation with inline SVG animation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find("if (!document.querySelector('.gisAnnotation')) {")
          end = s.find("\n}\n\nconst pdfs", start)
          if start < 0 or end < 0:
              raise SystemExit('annotation block not found')
          block = r'''if (!document.querySelector('.gisAnnotation')) {
            const ann = document.createElement('div');
            ann.className = 'gisAnnotation';
            ann.style.cssText = 'position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:block;opacity:0.72;mix-blend-mode:screen;';
            ann.innerHTML = `
              <svg viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;">
                <defs>
                  <filter id="gisGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                  <linearGradient id="gisLine" x1="0" x2="1"><stop offset="0" stop-color="#42dfbf" stop-opacity="0"/><stop offset="0.5" stop-color="#42dfbf" stop-opacity="0.65"/><stop offset="1" stop-color="#e9c66f" stop-opacity="0"/></linearGradient>
                </defs>
                <g fill="none" stroke="#42dfbf" stroke-opacity="0.16">
                  <ellipse cx="270" cy="220" rx="300" ry="120" stroke-width="1"><animateTransform attributeName="transform" type="rotate" from="0 270 220" to="360 270 220" dur="20s" repeatCount="indefinite"/></ellipse>
                  <ellipse cx="1330" cy="690" rx="240" ry="105" stroke="#e9c66f" stroke-opacity="0.13" stroke-width="1"><animateTransform attributeName="transform" type="rotate" from="360 1330 690" to="0 1330 690" dur="24s" repeatCount="indefinite"/></ellipse>
                  <path d="M0 310 L330 255 L610 330 L900 245 L1240 320 L1600 265" stroke="url(#gisLine)" stroke-width="1"/>
                  <path d="M0 620 L320 650 L620 585 L940 660 L1260 590 L1600 640" stroke="url(#gisLine)" stroke-width="1" opacity="0.5"/>
                  <path d="M170 120 L420 270 L700 190 L1010 360 L1280 220 L1490 410" stroke="#42dfbf" stroke-opacity="0.11" stroke-width="1" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="-120" dur="8s" repeatCount="indefinite"/></path>
                </g>
                <g filter="url(#gisGlow)">
                  <circle cx="170" cy="120" r="4" fill="#42dfbf"><animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite"/></circle>
                  <circle cx="420" cy="270" r="4" fill="#e9c66f"><animate attributeName="r" values="3;7;3" dur="3.7s" repeatCount="indefinite"/></circle>
                  <circle cx="700" cy="190" r="4" fill="#42dfbf"><animate attributeName="r" values="3;7;3" dur="4.2s" repeatCount="indefinite"/></circle>
                  <circle cx="1010" cy="360" r="4" fill="#e9c66f"><animate attributeName="r" values="3;7;3" dur="3.4s" repeatCount="indefinite"/></circle>
                  <circle cx="1280" cy="220" r="4" fill="#42dfbf"><animate attributeName="r" values="3;7;3" dur="4s" repeatCount="indefinite"/></circle>
                </g>
                <g font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="3" fill="#9dc9d0" fill-opacity="0.34">
                  <text x="185" y="105">UTILITY / GIS / LIVE</text>
                  <text x="1040" y="345">UTM · NETWORK · DATA</text>
                  <text x="115" y="665">CAD → GIS → QA/QC</text>
                  <text x="1190" y="620">FIELD / DATABASE / DELIVERY</text>
                </g>
                <line x1="0" x2="1600" y1="450" y2="450" stroke="#42dfbf" stroke-opacity="0.12" stroke-width="1" filter="url(#gisGlow)">
                  <animate attributeName="y1" values="190;720;190" dur="7s" repeatCount="indefinite"/><animate attributeName="y2" values="190;720;190" dur="7s" repeatCount="indefinite"/>
                </line>
              </svg>`;
            document.body.prepend(ann);
          }'''
          s = s[:start] + block + s[end+2:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Force visible animated GIS annotation'
          git push origin HEAD:main
