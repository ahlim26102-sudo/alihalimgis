name: Restore animated GIS background annotation
on:
  push:
    paths:
      - '.github/workflows/restore-gis-annotation.yml'
permissions:
  contents: write
jobs:
  restore-annotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add animated GIS annotation layer
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ANIMATED GIS BACKGROUND ANNOTATION V1 */'
          if marker not in s:
              css = r'''
          /* ANIMATED GIS BACKGROUND ANNOTATION V1 */
          .gisAnnotation{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;opacity:.72}
          .gisAnnotation:before{content:"";position:absolute;left:-8vw;top:12vh;width:44vw;height:44vw;max-width:620px;max-height:620px;border:1px solid rgba(66,223,191,.13);border-radius:50%;box-shadow:0 0 90px rgba(66,223,191,.05),inset 0 0 70px rgba(66,223,191,.025);animation:gisOrbitA 18s linear infinite}
          .gisAnnotation:after{content:"";position:absolute;right:-11vw;bottom:2vh;width:34vw;height:34vw;max-width:480px;max-height:480px;border:1px solid rgba(233,198,111,.10);border-radius:50%;box-shadow:0 0 70px rgba(233,198,111,.04);animation:gisOrbitB 24s linear infinite reverse}
          .gisAnnotation .route{position:absolute;left:2vw;right:2vw;top:34%;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(66,223,191,.05) 10%,rgba(66,223,191,.30) 48%,rgba(233,198,111,.16) 70%,transparent 100%);transform:rotate(-9deg);box-shadow:0 0 16px rgba(66,223,191,.08);animation:gisSweep 7s ease-in-out infinite}
          .gisAnnotation .route.r2{top:63%;transform:rotate(7deg);opacity:.52;animation-delay:1.8s}
          .gisAnnotation .node{position:absolute;width:6px;height:6px;border-radius:50%;background:#42dfbf;box-shadow:0 0 0 4px rgba(66,223,191,.06),0 0 18px rgba(66,223,191,.24);animation:gisPulse 3.6s ease-in-out infinite}
          .gisAnnotation .node.g{background:#e9c66f;box-shadow:0 0 0 4px rgba(233,198,111,.06),0 0 18px rgba(233,198,111,.22)}
          .gisAnnotation .n1{left:11%;top:22%}.gisAnnotation .n2{left:29%;top:37%;animation-delay:.7s}.gisAnnotation .n3{right:24%;top:27%;animation-delay:1.4s}.gisAnnotation .n4{right:12%;top:58%;animation-delay:2.1s}.gisAnnotation .n5{left:18%;bottom:18%;animation-delay:.9s}.gisAnnotation .n6{right:34%;bottom:12%;animation-delay:1.7s}
          .gisAnnotation .label{position:absolute;font:700 7px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em;color:rgba(157,201,208,.34);text-transform:uppercase;white-space:nowrap;animation:gisLabel 6s ease-in-out infinite}
          .gisAnnotation .l1{left:13%;top:19%}.gisAnnotation .l2{right:16%;top:24%;animation-delay:1.2s}.gisAnnotation .l3{left:22%;bottom:22%;animation-delay:2.4s}.gisAnnotation .l4{right:28%;bottom:16%;animation-delay:3.1s}
          .gisAnnotation .cross{position:absolute;width:12px;height:12px;opacity:.28}.gisAnnotation .cross:before,.gisAnnotation .cross:after{content:"";position:absolute;background:rgba(66,223,191,.35)}.gisAnnotation .cross:before{left:5px;top:0;width:1px;height:12px}.gisAnnotation .cross:after{left:0;top:5px;width:12px;height:1px}
          .gisAnnotation .c1{left:37%;top:18%}.gisAnnotation .c2{right:38%;top:72%}.gisAnnotation .c3{right:9%;bottom:25%}
          @keyframes gisOrbitA{to{transform:rotate(360deg)}}
          @keyframes gisOrbitB{to{transform:rotate(-360deg)}}
          @keyframes gisSweep{0%,100%{opacity:.2;transform:translateX(-3%) rotate(-9deg)}50%{opacity:.85;transform:translateX(3%) rotate(-9deg)}}
          @keyframes gisPulse{0%,100%{transform:scale(.75);opacity:.28}50%{transform:scale(1.6);opacity:.9}}
          @keyframes gisLabel{0%,100%{opacity:.18;transform:translateY(0)}50%{opacity:.52;transform:translateY(-4px)}}
          @media(max-width:680px){.gisAnnotation{opacity:.58}.gisAnnotation:before{width:74vw;height:74vw;left:-28vw;top:22vh}.gisAnnotation:after{width:58vw;height:58vw;right:-27vw;bottom:12vh}.gisAnnotation .label{font-size:6px}.gisAnnotation .route{top:31%}.gisAnnotation .route.r2{top:69%}}
          @media(prefers-reduced-motion:reduce){.gisAnnotation:before,.gisAnnotation:after,.gisAnnotation .route,.gisAnnotation .node,.gisAnnotation .label{animation:none!important}}
          '''
              s = s.replace('</style>', css + '\n</style>', 1)
              inject = r'''
          /* animated background annotation element */
          if (!document.querySelector('.gisAnnotation')) {
            const ann = document.createElement('div');
            ann.className = 'gisAnnotation';
            ann.innerHTML = '<span class="route"></span><span class="route r2"></span><span class="node n1"></span><span class="node n2"></span><span class="node n3 g"></span><span class="node n4"></span><span class="node n5 g"></span><span class="node n6"></span><span class="label l1">UTILITY / GIS / LIVE</span><span class="label l2">UTM · NETWORK · DATA</span><span class="label l3">CAD → GIS → QA/QC</span><span class="label l4">FIELD / DATABASE / DELIVERY</span><span class="cross c1"></span><span class="cross c2"></span><span class="cross c3"></span>';
            document.body.prepend(ann);
          }
          '''
              needle = 'document.body.innerHTML=doc.body.innerHTML;'
              s = s.replace(needle, needle + '\n' + inject, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Annotation already present; no changes needed.')
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore animated GIS background annotation'
          git push origin HEAD:main
