name: Add profile badge
on:
  push:
    paths:
      - .github/workflows/add-profile-badge.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add profile badge to hero
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''.profileBadge{position:absolute;left:22px;bottom:22px;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border:1px solid rgba(53,211,178,.38);border-radius:18px;background:rgba(5,18,24,.82);backdrop-filter:blur(14px);box-shadow:0 16px 42px rgba(0,0,0,.34);animation:badgeFloat 5.5s ease-in-out infinite}.profileBadgePhoto{width:72px;height:72px;flex:0 0 72px;border-radius:15px;overflow:hidden;border:1px solid rgba(232,196,110,.7);background:#07151d;display:flex;align-items:flex-end;justify-content:center}.profileBadgePhoto img{height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 7px 10px rgba(0,0,0,.35))}.profileBadgeMeta{min-width:155px}.profileBadgeMeta .name{font-size:19px;font-weight:950;letter-spacing:-.02em}.profileBadgeMeta .role{font-size:10px;color:#e8c46e;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.profileBadgeMeta .sub{font-size:10px;color:#9db4bd;margin-top:3px}.liveDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#35d3b2;box-shadow:0 0 0 5px rgba(53,211,178,.09);margin-right:6px;vertical-align:middle;animation:badgePulse 1.8s ease-in-out infinite}@keyframes badgeFloat{50%{transform:translateY(-5px)}}@keyframes badgePulse{50%{box-shadow:0 0 0 8px rgba(53,211,178,.03)}}@media(max-width:680px){.profileBadge{left:14px;right:14px;bottom:14px;padding:9px 11px}.profileBadgePhoto{width:58px;height:58px;flex-basis:58px}.profileBadgeMeta .name{font-size:16px}.profileBadgeMeta .sub{font-size:9px}}'''
          if '.profileBadge{' not in s:
              s = s.replace('.globeBox{', css + '.globeBox{', 1)
          marker = '<div class="globeBox reveal">'
          badge = '''<div class="profileBadge"><div class="profileBadgePhoto"><img src="https://raw.githubusercontent.com/ahlim26102-sudo/alihalimgis/main/ali-halim-portrait-original-cutout.png" alt="Ali Halim"></div><div class="profileBadgeMeta"><div class="name">ALI HALIM</div><div class="role"><span class="liveDot"></span>GIS SPECIALIST</div><div class="sub">Utility GIS · CAD → GIS · Automation</div></div></div>'''
          if marker in s and 'class="profileBadge"' not in s:
              s = s.replace(marker, marker + badge, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore hero profile badge"
          git push