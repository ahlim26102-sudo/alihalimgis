name: Update GEOORBIT Converter branding
on:
  push:
    paths:
      - .github/workflows/update-geoorbit-brand.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch GEOORBIT section
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<section id="toolbox"')
          end = s.find('</section>', start)
          if start == -1 or end == -1:
              raise SystemExit('toolbox section not found')
          end += len('</section>')
          sec = s[start:end]
          sec = sec.replace('06 · GEO ORBIT TOOLBOX', '06 · GEOORBIT CONVERTER')
          sec = sec.replace('GEO ORBIT TOOLBOX', 'GEOORBIT CONVERTER')
          sec = sec.replace('GEO ORBIT CONVERTER · V1.3', 'GEOORBIT CONVERTER · V1.3')
          sec = sec.replace('GEO ORBIT CONVERTER', 'GEOORBIT CONVERTER')
          sec = sec.replace('Personal GIS tool for coordinate conversion, batch workflows, map preview and survey-oriented utilities.', 'Personal GIS conversion tool for coordinate handling, batch workflows, map preview and survey-oriented utilities.')
          sec = sec.replace('A personal software project designed for surveyors and GIS users to simplify file conversion, coordinate handling, map preview and repeatable data-processing tasks.', 'A personal desktop software project developed by Ali Halim for surveyors and GIS users, focused on practical file conversion, coordinate handling, map preview and repeatable data-processing workflows.')
          sec = sec.replace('src="geo-orbit-map.jpg" alt="GEO ORBIT GIS software interface"', 'src="geoorbit-converter-v1-3.jpg" onerror="this.onerror=null;this.src=\'geo-orbit-map.jpg\'" alt="GEOORBIT CONVERTER V1.3 software interface"')
          sec = sec.replace('GEO ORBIT is presented as a personal GIS software project developed by Ali Halim', 'GEOORBIT CONVERTER is presented as a personal GIS software project developed by Ali Halim')
          sec = sec.replace('GEO ORBIT demonstrates', 'GEOORBIT demonstrates')
          sec = sec.replace('GEO ORBIT', 'GEOORBIT')
          if 'CURRENT INTERFACE' not in sec:
              sec = sec.replace('<div class="toolSpecs">', '<div class="tags"><span class="tag">CURRENT INTERFACE · V1.3</span><span class="tag">DEVELOPED BY ALI HALIM</span></div><div class="toolSpecs">', 1)
          s = s[:start] + sec + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update GEOORBIT Converter branding"
          git push