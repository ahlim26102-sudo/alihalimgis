name: Force GEOORBIT V1.3 image
on:
  push:
    paths:
      - .github/workflows/force-geoorbit-v13-image.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portfolio
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://raw.githubusercontent.com/ahlim26102-sudo/alihalimgis/main/geo-orbit-map.jpg'
          new = 'https://raw.githubusercontent.com/ahlim26102-sudo/alihalimgis/main/geoorbit-converter-v1-3.jpg'
          s = s.replace(old, new)
          s = s.replace('src="geo-orbit-map.jpg"', 'src="geoorbit-converter-v1-3.jpg"')
          s = s.replace('GEO ORBIT MAP', 'GEOORBIT CONVERTER V1.3')
          s = s.replace('GEO ORBIT MAP V1.5.13 PRO GIS EDITION', 'GEOORBIT CONVERTER V1.3')
          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Force GEOORBIT Converter V1.3 image"
          git push
