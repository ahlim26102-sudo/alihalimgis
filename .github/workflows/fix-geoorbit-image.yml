name: Fix GEOORBIT Converter image
on:
  push:
    paths:
      - .github/workflows/fix-geoorbit-image.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GEOORBIT showcase image
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<section id="toolbox"')
          if start == -1:
              raise SystemExit('toolbox section not found')
          end = s.find('</section>', start)
          if end == -1:
              raise SystemExit('toolbox section end not found')
          end += len('</section>')
          sec = s[start:end]
          sec = sec.replace('geo-orbit-map.jpg', 'geoorbit-converter-v1-3.jpg')
          sec = sec.replace('GEO ORBIT MAP', 'GEOORBIT CONVERTER')
          sec = sec.replace('GEO ORBIT is presented', 'GEOORBIT CONVERTER is presented')
          s = s[:start] + sec + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use new GEOORBIT Converter screenshot"
          git push
