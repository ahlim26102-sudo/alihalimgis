name: Make profile portrait clickable
on:
  push:
    paths:
      - '.github/workflows/make-portrait-clickable.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow portrait in lightbox and improve mobile portrait target
        shell: python
        run: |
          from pathlib import Path
          p=Path('lightbox.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("    if (img.closest('.photo')) return false;\n", "")
          s=s.replace("    if (!img.naturalWidth || !img.naturalHeight) return false;\n" if "if (!img.naturalWidth || !img.naturalHeight) return false;\n" in s else "", "")
          p.write_text(s,encoding='utf-8')
          p=Path('legacy.html')
          s=p.read_text(encoding='utf-8')
          marker='/* PROFILE PORTRAIT LIGHTBOX V1 */'
          if marker not in s:
              css='''\n/* PROFILE PORTRAIT LIGHTBOX V1 */\n.photo{cursor:zoom-in;position:relative}\n.photo:after{content:"VIEW PROFILE";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);padding:3px 6px;border:1px solid rgba(233,198,111,.45);border-radius:999px;background:rgba(3,14,19,.72);color:#e9c66f;font:800 7px/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap}\n.photo:hover:after,.photo:focus-within:after{opacity:1}\n@media(max-width:680px){.photo:after{opacity:.85;font-size:6px}}\n'''
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lightbox.js legacy.html
          git commit -m 'Make profile portrait clickable' || true
          git rm .github/workflows/make-portrait-clickable.yml || true
          git commit -m 'Remove one-time portrait lightbox workflow' || true
          git push origin HEAD:main
