name: Polish contact cards with icons
on:
  push:
    paths:
      - .github/workflows/contact-icons.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace contact cards
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
          /* PREMIUM CONTACT CARDS */
          .contact{display:grid;grid-template-columns:1fr 1fr;gap:14px}
          .contactCard{position:relative;display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:15px;padding:18px 19px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#0a222c,#071820);overflow:hidden;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
          .contactCard:before{content:"";position:absolute;inset:auto -20% -70% auto;width:180px;height:150px;background:radial-gradient(circle,rgba(56,214,183,.11),transparent 65%);pointer-events:none}
          .contactCard:hover{transform:translateY(-4px);border-color:#3f7380;box-shadow:0 18px 42px rgba(0,0,0,.22)}
          .contactIcon{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;border:1px solid rgba(56,214,183,.35);background:linear-gradient(160deg,#0d3440,#08202a);color:var(--teal)}
          .contactIcon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
          .contactCard .label{font-size:10px;color:var(--gold);font-weight:950;letter-spacing:.16em;text-transform:uppercase}
          .contactCard b{display:block;font-size:16px;margin-top:2px}
          .contactCard span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
          .contactArrow{font-size:18px;color:#7f9ea8;transition:transform .2s ease,color .2s ease}.contactCard:hover .contactArrow{transform:translateX(4px);color:var(--teal)}
          @media(max-width:650px){.contact{grid-template-columns:1fr}.contactCard{grid-template-columns:48px 1fr auto;padding:15px}.contactIcon{width:48px;height:48px;border-radius:13px}.contactIcon svg{width:23px;height:23px}.contactCard b{font-size:14px}.contactCard span{font-size:10px}.contactArrow{font-size:16px}}
          '''
          start = s.find('<section id="contact"')
          if start == -1:
              raise SystemExit('contact section not found')
          end = s.find('</section>', start)
          if end == -1:
              raise SystemExit('contact section end not found')
          end += len('</section>')
          section = '''<section id="contact" class="section"><div class="wrap">
            <div class="head reveal"><div><div class="ey">09 · CONTACT</div><h2>Let’s work together.</h2></div><p>Available for remote GIS projects, utility mapping, CAD-to-GIS conversion, spatial data preparation, QA/QC and GIS automation.</p></div>
            <div class="contact">
              <a class="contactCard reveal" href="mailto:Ahlim26102@gmail.com"><div class="contactIcon"><svg viewBox="0 0 24 24"><path d="M4 6.5h16A1.5 1.5 0 0 1 21.5 8v8A1.5 1.5 0 0 1 20 17.5H4A1.5 1.5 0 0 1 2.5 16V8A1.5 1.5 0 0 1 4 6.5Z"/><path d="m3.2 7.4 8.1 6.2a1.1 1.1 0 0 0 1.4 0l8.1-6.2"/></svg></div><div><div class="label">Email</div><b>Ahlim26102@gmail.com</b><span>Direct email contact</span></div><div class="contactArrow">↗</div></a>
              <a class="contactCard reveal" href="https://www.linkedin.com/in/ali-mohamed-abdelhalim" target="_blank" rel="noopener"><div class="contactIcon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 10v7"/><path d="M8 7.2v.1"/><path d="M12 17v-4.1a2.6 2.6 0 0 1 5.2 0V17"/><path d="M12 12.9v-.4"/></svg></div><div><div class="label">LinkedIn</div><b>Ali Halim</b><span>Professional profile & network</span></div><div class="contactArrow">↗</div></a>
              <a class="contactCard reveal" href="tel:+201022988139"><div class="contactIcon"><svg viewBox="0 0 24 24"><path d="M7.2 3.5h2.1l1.2 5-2 1.4a15.2 15.2 0 0 0 5.6 5.6l1.4-2 5 1.2v2.1c0 1-.8 1.7-1.7 1.7C11.8 18.5 5.5 12.2 5.5 5.2c0-1 .7-1.7 1.7-1.7Z"/></svg></div><div><div class="label">Phone</div><b>+20 102 298 8139</b><span>Tap to call</span></div><div class="contactArrow">↗</div></a>
              <a class="contactCard reveal" href="Ali_Mohamed_Abdelhaleem_CV.pdf" target="_blank" rel="noopener"><div class="contactIcon"><svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20H7z"/><path d="M14 3.5V8h4"/><path d="M9.5 12h5"/><path d="M9.5 15h5"/><path d="M9.5 18h3"/></svg></div><div><div class="label">CV</div><b>Open Professional CV</b><span>View qualifications & experience</span></div><div class="contactArrow">↗</div></a>
            </div></div></section>'''
          s = s[:start] + section + s[end:]
          if '/* PREMIUM CONTACT CARDS */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add premium contact icons and cards"
          git push
