name: Upgrade GIS background and mobile interactions
on:
  push:
    paths:
      - '.github/workflows/upgrade-mobile-gis-visuals.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade legacy portfolio runtime
        shell: python
        run: |
          from pathlib import Path

          legacy = Path('legacy.html')
          index = Path('index.html')
          s = legacy.read_text(encoding='utf-8')

          # Strong, visible GIS/HUD annotation — lives in legacy.html so the runtime loader keeps it.
          if '/* GIS ANNOTATION PRO V3 */' not in s:
              css = r'''
          /* GIS ANNOTATION PRO V3 */
          .gisAnnotation{position:fixed!important;inset:0!important;z-index:0!important;pointer-events:none!important;display:block!important;overflow:hidden!important;opacity:.92!important;mix-blend-mode:screen!important}
          .gisAnnotation svg{position:absolute;inset:0;width:100%;height:100%;display:block}
          .gisAnnotation .hud-fade{animation:hudFade 5s ease-in-out infinite alternate}
          .gisAnnotation .hud-fade.d2{animation-delay:1.1s}.gisAnnotation .hud-fade.d3{animation-delay:2.2s}
          .gisAnnotation .dash{stroke-dasharray:5 10;animation:dashMove 7s linear infinite}
          .gisAnnotation .dash.d2{animation-duration:11s;animation-direction:reverse}
          .gisAnnotation .spin{transform-origin:center;transform-box:fill-box;animation:spinHud 18s linear infinite}
          .gisAnnotation .spin.s2{animation-duration:27s;animation-direction:reverse}
          .gisAnnotation .pulse{animation:nodePulse 2.8s ease-in-out infinite}
          .gisAnnotation .pulse.p2{animation-delay:.45s}.gisAnnotation .pulse.p3{animation-delay:.9s}.gisAnnotation .pulse.p4{animation-delay:1.35s}.gisAnnotation .pulse.p5{animation-delay:1.8s}.gisAnnotation .pulse.p6{animation-delay:2.25s}
          .gisAnnotation .scan{animation:scanHud 6s ease-in-out infinite}
          .gisAnnotation .orbital{stroke-dasharray:160 40;animation:orbitDash 10s linear infinite}
          .gisAnnotation .orbital.o2{animation-duration:15s;animation-direction:reverse}
          body>header,body>main,body>footer{position:relative;z-index:2}
          .hero .chip{transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;cursor:pointer}
          .hero .chip:hover{transform:translateY(-2px);border-color:rgba(66,223,191,.6);background:rgba(66,223,191,.09);box-shadow:0 7px 18px rgba(0,0,0,.16)}
          @keyframes hudFade{0%,100%{opacity:.18}50%{opacity:.78}}
          @keyframes dashMove{to{stroke-dashoffset:-120}}
          @keyframes spinHud{to{transform:rotate(360deg)}}
          @keyframes nodePulse{0%,100%{r:3;opacity:.22}50%{r:7;opacity:1}}
          @keyframes scanHud{0%,100%{transform:translateY(0);opacity:.1}50%{transform:translateY(520px);opacity:.9}}
          @keyframes orbitDash{to{stroke-dashoffset:-200}}
          @media(max-width:680px){.gisAnnotation{opacity:.72!important}.gisAnnotation text{font-size:10px}.gisAnnotation .routes{opacity:.9}.gisAnnotation .bigRing{stroke-width:1.4}}
          @media(prefers-reduced-motion:reduce){.gisAnnotation *{animation:none!important}}
          '''
              s = s.replace('</style>', css + '\n</style>', 1)

              ann = r'''
          <div class="gisAnnotation" aria-hidden="true">
            <svg viewBox="0 0 1600 900" preserveAspectRatio="none">
              <defs>
                <filter id="hudGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                <linearGradient id="hudLine" x1="0" x2="1"><stop offset="0" stop-color="#42dfbf" stop-opacity="0"/><stop offset=".22" stop-color="#42dfbf" stop-opacity=".55"/><stop offset=".55" stop-color="#e9c66f" stop-opacity=".48"/><stop offset="1" stop-color="#42dfbf" stop-opacity="0"/></linearGradient>
              </defs>

              <!-- layered network / globe-style annotation -->
              <g fill="none" stroke-linecap="round" stroke-linejoin="round">
                <g class="spin" opacity=".55">
                  <ellipse class="bigRing" cx="270" cy="210" rx="340" ry="138" stroke="#42dfbf" stroke-opacity=".22"/>
                  <ellipse cx="270" cy="210" rx="250" ry="90" stroke="#e9c66f" stroke-opacity=".13" transform="rotate(-18 270 210)"/>
                </g>
                <g class="spin s2" opacity=".5">
                  <ellipse class="bigRing" cx="1340" cy="690" rx="320" ry="124" stroke="#e9c66f" stroke-opacity=".18" transform="rotate(-14 1340 690)"/>
                  <ellipse cx="1340" cy="690" rx="225" ry="82" stroke="#42dfbf" stroke-opacity=".12" transform="rotate(18 1340 690)"/>
                </g>

                <path class="dash" d="M0 185 L165 135 L345 185 L540 110 L760 168 L990 95 L1205 160 L1420 118 L1600 160" stroke="#42dfbf" stroke-opacity=".34"/>
                <path class="dash d2" d="M0 740 L190 690 L405 748 L620 676 L855 735 L1080 668 L1315 730 L1485 682 L1600 710" stroke="#e9c66f" stroke-opacity=".26"/>
                <path d="M90 410 L250 280 L415 345 L600 235 L785 320 L975 205 L1180 298 L1390 210 L1535 310" stroke="#42dfbf" stroke-opacity=".26"/>
                <path d="M75 585 L220 500 L380 548 L565 445 L735 520 L910 420 L1090 505 L1280 420 L1510 520" stroke="#42dfbf" stroke-opacity=".14" stroke-dasharray="3 9"/>
                <path d="M70 270 L240 405 L430 260 L615 390 L805 250 L1000 395 L1185 270 L1365 405 L1530 245" stroke="#e9c66f" stroke-opacity=".13" stroke-dasharray="2 10"/>

                <g class="routes" stroke="url(#hudLine)" filter="url(#hudGlow)">
                  <path d="M0 348 C220 312 340 390 540 345 S905 305 1115 350 S1390 375 1600 332" stroke-width="1.4"/>
                  <path d="M0 552 C210 505 350 590 550 545 S900 510 1110 558 S1390 590 1600 540" stroke-width="1" opacity=".65"/>
                </g>

                <g stroke="#42dfbf" stroke-opacity=".32" stroke-width="1" class="hud-fade">
                  <path d="M245 205 L345 185 L415 345 L600 235 L785 320"/>
                  <path d="M975 205 L1180 298 L1280 420 L1390 210"/>
                  <path d="M380 548 L565 445 L735 520 L910 420 L1090 505"/>
                </g>
              </g>

              <g filter="url(#hudGlow)">
                <circle class="pulse" cx="165" cy="135" r="4" fill="#42dfbf"/><circle class="pulse p2" cx="345" cy="185" r="4" fill="#e9c66f"/>
                <circle class="pulse p3" cx="540" cy="110" r="4" fill="#42dfbf"/><circle class="pulse p4" cx="785" cy="320" r="4" fill="#e9c66f"/>
                <circle class="pulse p5" cx="1180" cy="298" r="4" fill="#42dfbf"/><circle class="pulse p6" cx="1420" cy="118" r="4" fill="#e9c66f"/>
                <circle cx="250" cy="500" r="3" fill="#42dfbf"/><circle cx="565" cy="445" r="3" fill="#e9c66f"/><circle cx="910" cy="420" r="3" fill="#42dfbf"/><circle cx="1280" cy="420" r="3" fill="#e9c66f"/>
              </g>

              <g fill="#9dc9d0" fill-opacity=".55" font-family="ui-monospace,Consolas,monospace" letter-spacing="2">
                <text x="150" y="125" class="hud-fade">GIS / UTILITY NODE</text>
                <text x="545" y="98" class="hud-fade d2">UTM / 32637</text>
                <text x="1175" y="282" class="hud-fade d3">NETWORK / QA-QC</text>
                <text x="1330" y="105" class="hud-fade">CAD → GIS</text>
                <text x="70" y="770" class="hud-fade d2">FIELD DATA / DATABASE / DELIVERY</text>
                <text x="1210" y="815" class="hud-fade d3">SPATIAL ANALYSIS / AUTOMATION</text>
              </g>

              <g class="orbital" fill="none" stroke="#42dfbf" stroke-opacity=".22">
                <circle cx="800" cy="450" r="260"/><circle class="o2" cx="800" cy="450" r="340" stroke="#e9c66f" stroke-opacity=".13"/>
              </g>
              <g opacity=".8">
                <circle cx="800" cy="450" r="4" fill="#42dfbf" filter="url(#hudGlow)"/>
                <circle cx="800" cy="450" r="85" fill="none" stroke="#42dfbf" stroke-opacity=".08"/>
              </g>

              <g class="scan" opacity=".7" filter="url(#hudGlow)">
                <line x1="0" x2="1600" y1="140" y2="140" stroke="url(#hudLine)" stroke-width="1.4"/>
              </g>
            </svg>
          </div>
          '''
              s = s.replace('<body>', '<body>' + ann, 1)

          # Make the hero capability chips real links instead of inert button-like spans.
          old_chips = '<div class="chips"><span class="chip">100+ CAD → GIS Projects</span><span class="chip">Utility Networks</span><span class="chip">Enterprise Geodatabase</span><span class="chip">QA/QC</span><span class="chip">Python / ArcPy</span></div>'
          new_chips = '<div class="chips"><a class="chip" href="#projects">100+ CAD → GIS Projects</a><a class="chip" href="#projects">Utility Networks</a><a class="chip" href="#about">Enterprise Geodatabase</a><a class="chip" href="#services">QA/QC</a><a class="chip" href="#tool">Python / ArcPy</a></div>'
          if old_chips in s:
              s = s.replace(old_chips, new_chips, 1)

          # Hide duplicate annotation creation from index; the robust annotation now lives in legacy.html.
          idx = index.read_text(encoding='utf-8')
          start = idx.find('/* animated background annotation element */')
          if start >= 0:
              bstart = idx.rfind('if (!document.querySelector(\'.gisAnnotation\')) {', 0, start)
              if bstart >= 0:
                  bend = idx.find('const pdfs', start)
                  if bend >= 0:
                      idx = idx[:bstart] + idx[bend:]
          index.write_text(idx, encoding='utf-8')
          legacy.write_text(s, encoding='utf-8')

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legacy.html index.html
          git commit -m 'Upgrade GIS background annotation and mobile chips'
          git rm .github/workflows/upgrade-mobile-gis-visuals.yml
          git commit -m 'Remove one-time visual upgrade workflow'
          git push origin HEAD:main
